<!doctype html>
<html lang="{{ lang }}"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#222f40">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-192.png?v=3">
<meta name="mobile-web-app-capable" content="yes">
<title>{{ institute or coaching }}</title>
<style>
:root{--navy:#222f40;--ink:#1c2634;--paper:#f2f5f9;--line:#e3e9f0;--gold:#7d93ad;--green:#2f7d3a;--red:#c0392b;--amber:#8a6a00;--muted:#6b7686}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);padding-bottom:92px}
header{background:var(--navy);color:#fff;padding:18px 18px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.hl{display:flex;align-items:center;gap:14px;text-decoration:none;color:#fff;min-width:0}
.lg{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex:none}
.ht{min-width:0}
.ht small{display:block;font-size:15px;color:#b4c0d3}
.ht b{display:block;font-size:22px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.hr{display:flex;align-items:center;gap:10px;flex:none}
.lang{display:flex;border:1px solid rgba(255,255,255,.3);border-radius:20px;overflow:hidden;font-size:12px}
.lang a{padding:6px 10px;font-weight:700;color:#cfd8e6;text-decoration:none}
.lang a.on{background:#fff;color:var(--navy)}
.bell{position:relative;width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;color:#fff}
.bell i{position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:50%;background:#e5484d;border:2px solid var(--navy)}
main{padding:16px;max-width:640px;margin:auto}
h1.page{font-weight:700;font-size:26px;margin:4px 0 16px;color:var(--navy)}
h1.page,.big,.cls .n,.hero .num,.mt,h2,summary b,.av{font-family:inherit!important}
.sect{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;font-weight:600}
.muted{color:var(--muted);font-size:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
.hero{background:var(--navy);color:#fff;border-radius:20px;padding:20px;margin-bottom:14px}
.hero .lbl{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:#b4c0d3}
.hero .num{font-size:52px;font-weight:700;line-height:1.05;margin:8px 0 4px}
.hero .sub{font-size:13px;color:#b4c0d3}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cls{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px}
.cls:active{background:#f7f9fb}
.cls .k{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.cls .n{font-size:34px;font-weight:700;color:var(--navy);margin:2px 0}
.cls .u{font-size:13px;color:var(--muted)}
.item{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;background:#fff;border:1px solid var(--line);border-radius:18px;margin-bottom:10px;text-decoration:none;color:inherit;font-weight:600}
.item:active{background:#f7f9fb}
.chev{color:#b5bcc8;font-size:22px;line-height:1}
.kv{display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}
.kv span:first-child{color:var(--muted);font-size:14px}
.kv span:last-child{font-weight:600;text-align:right}
.av{width:62px;height:62px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:26px;flex:none}
label{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:14px 0 5px}
input,select{width:100%;padding:13px 12px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fff;color:var(--ink);font-family:inherit}
input:focus,select:focus{outline:2px solid rgba(34,47,64,.2);border-color:var(--navy)}
button,.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--navy);color:#fff;border:0;border-radius:14px;padding:14px 16px;font-size:16px;font-weight:600;width:100%;text-decoration:none;font-family:inherit}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);margin-top:10px}
.btn.danger{background:#fff;color:var(--red);border:1px solid #efcdc8}
.err{background:#fcefed;color:var(--red);border:1px solid #f0cdc8;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.big{font-size:32px;font-weight:700;color:var(--navy)}
.badge{background:#e8edf3;color:var(--navy);border-radius:20px;padding:3px 10px;font-size:13px;font-weight:600}
nav{position:fixed;bottom:0;left:0;right:0;background:#111418;display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 0 10px;color:#8e98a8;text-decoration:none;font-size:12px;font-weight:500}
nav a.on{color:#fff;font-weight:700}
.ic{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
<header>
<a class="hl" href="/"><span class="lg"><svg width="32" height="26" viewBox="96 138 322 242" aria-hidden="true"><polygon points="166,236 346,236 346,326 256,372 166,326" fill="#9a7a2c"/><polygon points="102,230 256,300 410,230 256,160" fill="#222f40"/><polygon points="102,220 256,290 410,220 256,150" fill="#d4ad55"/><rect x="407" y="222" width="6" height="84" fill="#d4ad55"/><circle cx="410" cy="314" r="12" fill="#d4ad55"/></svg></span>
<span class="ht"><small>{% block hsub %}{{ coaching }}{% endblock %}</small><b>{{ institute or coaching }}</b></span></a>
<span class="hr">{% block hextra %}{% endblock %}<span class="lang"><a href="/lang/en" class="{{ 'on' if lang=='en' }}">EN</a><a href="/lang/hi" class="{{ 'on' if lang=='hi' }}">हिं</a></span></span>
</header>
<main>{% block body %}{% endblock %}</main>
{% if user_name %}<nav>
<a href="/" class="{{ 'on' if request.path=='/' }}"><svg class="ic" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>{{ t('nav_home') }}</a>
<a href="/students" class="{{ 'on' if request.path.startswith('/students') }}"><svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.2c2.6.2 4.5 2 4.5 5.3"/></svg>{{ t('nav_students') }}</a>
<a href="/hazri" class="{{ 'on' if request.path.startswith('/hazri') }}"><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M8 3v4M16 3v4M4 10h16M9 15l2 2 4-4"/></svg>{{ t('nav_attendance') }}</a>
<a href="/fees" class="{{ 'on' if request.path.startswith('/fees') }}"><svg class="ic" viewBox="0 0 24 24"><path d="M7 5h10M7 9h10M8 5c4.5 0 6.5 1.6 6.5 4s-2 4-6.5 4H7l7 7"/></svg>{{ t('nav_fees') }}</a>
<a href="/more" class="{{ 'on' if request.path.startswith(('/more', '/backup', '/settings', '/records', '/report', '/batches')) }}"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h11M19 18h1"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>{{ t('nav_more') }}</a>
</nav>{% endif %}
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js")}</script>
</body></html>
