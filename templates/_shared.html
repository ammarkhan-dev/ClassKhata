<style>
.g{color:var(--green)}
.r{color:var(--red)}
.stu{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.stu b{font-size:16px}
.pa{display:flex;gap:10px;margin-top:10px}
.pa>button{flex:1}
.pa button{padding:12px;font-size:15px}
.pa button.o{background:#fff;color:var(--muted);border:1px solid var(--line)}
.pa button.p.on{background:var(--green);border:1px solid var(--green);color:#fff}
.pa button.a.on{background:var(--red);border:1px solid var(--red);color:#fff}
.pa .btn.ghost{margin:0}
</style>
<style>
.pc{display:inline-block;border-radius:20px;padding:3px 10px;font-size:13px;font-weight:700}
.pc.hi{background:#e7f3ec;color:var(--green)}
.pc.mid{background:#f6efdc;color:#8a6a1f}
.pc.lo{background:#fbeeee;color:var(--red)}
.chip{display:inline-block;padding:7px 11px;margin:0 6px 8px 0;border-radius:20px;font-size:13px;font-weight:600;text-decoration:none;border:1px solid}
.chip.paid{background:#e7f3ec;color:var(--green);border-color:#cfe6d9}
.chip.due{background:#fbeeee;color:var(--red);border-color:#efcaca}
.chip.soon{background:#f6efdc;color:#8a6a1f;border-color:#eadfbd}
.pa>a{flex:1}
.nv{padding:2px 14px;font-size:26px;color:var(--navy);text-decoration:none;line-height:1}
.mt{font-family:Georgia,serif;font-size:19px;color:var(--navy)}
.wk,.days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.wk span{font-size:11px;color:var(--muted);padding:8px 0 4px}
.d{position:relative;padding:9px 0;margin:2px;font-size:14px;border-radius:50%}
.d.P{background:var(--green);color:#fff}
.d.A{background:var(--red);color:#fff}
.d.N{background:#ececec;color:#8a8f9c}
.d.tdy{outline:2px solid var(--gold);outline-offset:1px}
.lg{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.lg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
</style>
<style>
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
</style>
<style>
.pc.up{background:#e4ecf8;color:#2f4f9a}
.hb{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:transparent;color:#fff;padding:0;border:0}
.sheet{position:fixed;inset:0;background:rgba(10,15,25,.5);z-index:50;display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.sp{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:20px 22px 28px;max-height:78vh;overflow:auto}
.sp h3{margin:0 0 8px;font-size:22px;color:var(--navy)}
.ob{width:100%;background:none;color:var(--ink);border:0;border-top:1px solid var(--line);border-radius:0;padding:17px 0;justify-content:flex-start;font-size:17px;font-weight:600}
.ob.red{color:var(--red)}
.fl{font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:16px 0 10px;font-weight:600}
.chs{display:flex;flex-wrap:wrap;gap:8px}
.ch{margin:0;text-transform:none;letter-spacing:0}
.ch input{display:none}
.ch span{display:block;padding:10px 18px;border-radius:20px;border:1.5px solid var(--line);font-weight:600;font-size:15px;color:var(--ink);background:#fff}
.ch input:checked+span{background:var(--navy);border-color:var(--navy);color:#fff}
.ph{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:#fff;padding-left:14px}
.ph b{margin-right:8px}
.ph input{border:0;border-radius:0;padding-left:0;background:transparent}
.ph input:focus{outline:none}
button:disabled{background:#cfd5de;color:#fff}
.gr{background:var(--green)}
.og{background:#fff;color:var(--green);border:2px solid #4caf62}
</style>
