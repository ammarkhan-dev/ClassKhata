{% extends "base.html" %}

{% block hsub %}{{ b.name }}{% endblock %}
{% block body %}
<a class="muted" href="/batches/{{ b.id }}/edit" style="text-decoration:none">‹ {{ L.back }}</a>
<h1 class="page" style="margin-top:6px">{{ L.title }}</h1>
{% if err %}<div class="err">{{ err }}</div>{% endif %}
{% for g in rows %}
<div class="card" style="display:flex;align-items:center;gap:12px;margin:8px 0;padding:12px 14px">
  <div style="flex:1;min-width:0"><b>{{ g.name }}</b>{% if g.link %}<br><small class="muted">{{ g.link }}</small>{% endif %}</div>
  <form method="post" action="/batches/groups/{{ g.id }}/delete" onsubmit="return confirm({{ L.sure|tojson }})" style="margin:0">
    <button class="btn danger" style="margin:0;padding:8px 12px">{{ L.delete }}</button>
  </form>
</div>
{% else %}
<div class="card muted">{{ L.none }}</div>
{% endfor %}
<form method="post" class="card">
  <label style="margin-top:0">{{ L.name }}</label>
  <input name="name" required maxlength="60">
  <label>{{ L.link }}</label>
  <input name="link" placeholder="https://chat.whatsapp.com/...">
  <div style="height:14px"></div>
  <button>{{ L.add }}</button>
</form>
{% endblock %}
