<!doctype html>
<html lang="{{ 'hi' if lang == 'hi' else 'en' }}"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ L.f_title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--nv:#222f40}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,system-ui,sans-serif;background:#f1f4f9;color:#0f172a}
.top{background:var(--nv);color:#fff;padding:34px 20px 54px}
.top h1{margin:0;font-size:22px}
.box{background:#fff;margin:-34px 16px 24px;border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(15,23,42,.1)}
label{display:block;font-size:12.5px;color:#64748b;margin:12px 0 4px}
input{width:100%;padding:12px;border:1px solid #d6dde6;border-radius:10px;font-size:15px;font-family:inherit}
.btn{width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;background:var(--nv);color:#fff;font-size:14.5px;font-weight:600;font-family:inherit}
.err{background:#fdecec;color:#b42318;padding:10px 12px;border-radius:10px;font-size:13px;margin-top:6px}
.help{font-size:12.5px;color:#64748b;margin-top:14px;line-height:1.5}
a{color:var(--nv);font-weight:600;text-decoration:none}
</style></head><body>
<div class="top"><h1>{{ L.f_title }}</h1></div>
<form class="box" method="post">
  {% if err %}<div class="err">{{ err }}</div>{% endif %}
  <label>{{ L.f_name }}</label><input name="name" value="{{ name }}" required autocomplete="username">
  <label>{{ L.f_code }}</label><input name="code" placeholder="XXXX-XXXX-XXXX-XXXX" required autocapitalize="characters">
  <label>{{ L.new }}</label><input type="password" name="pw" required autocomplete="new-password">
  <label>{{ L.new2 }}</label><input type="password" name="pw2" required autocomplete="new-password">
  <button class="btn" type="submit">{{ L.f_btn }}</button>
  <div class="help">{{ L.f_help }}</div>
  <div class="help"><a href="/login">&lsaquo; {{ L.back }}</a></div>
</form>
</body></html>
