{% extends "base.html" %}
{% block body %}
<!--BKP--><a href="/backup" style="display:block;margin:6px 0 12px;padding:12px 14px;border-radius:12px;background:#fff;color:#222f40;text-decoration:none;font-weight:600;font-size:14px;text-align:center;box-shadow:0 1px 3px rgba(15,23,42,.1)">{{ 'बैकअप / डेटा डाउनलोड' if session.get('lang') == 'hi' else 'Backup / Download my data' }}</a><!--/BKP-->
<a class="muted" href="/" style="text-decoration:none">‹ {{ t('back') }}</a>
<h1 class="page" style="margin-top:6px">{{ t('settings') }}</h1>
{% if saved %}<div class="err" style="background:#e7f3ec;color:var(--green);border-color:#cfe6d9">{{ t('saved') }}</div>{% endif %}
<form method="post" class="card">
<label style="margin-top:0">{{ t('institute_name') }}</label>
<input name="inst" value="{{ institute }}" required>
<div style="height:18px"></div>
<button>{{ t('save') }}</button>
</form>
{% endblock %}
