{% extends "base.html" %}
{% block body %}
<div class="card" style="margin-top:24px">
<h2 style="margin:0 0 4px;color:var(--navy);font-family:Georgia,serif;font-weight:400;font-size:26px">{{ t('setup_title') }}</h2>
<p class="muted" style="margin-top:0">{{ t('setup_sub') }}</p>
<form method="post">
<label>{{ t('your_name') }}</label>
<input name="name" value="{{ name }}" placeholder="Ammar Khan" required autofocus>
<label>{{ t('password') }}</label>
<input type="password" name="pw" required>
<label>{{ t('confirm_password') }}</label>
<input type="password" name="pw2" required>
<label>{{ t('institute_name') }}</label>
<input name="inst" value="{{ inst }}" placeholder="{{ t('inst_ph') }}" required>
{% if err %}<div class="err" style="margin-top:14px">{{ t(err) }}</div>{% endif %}
<div style="height:18px"></div>
<button>{{ t('create_account') }}</button>
</form></div>
{% endblock %}
