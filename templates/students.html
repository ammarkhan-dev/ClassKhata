{% extends "base.html" %}
{% block body %}
<div class="card">
<form method="post">
<input name="name" placeholder="Student ka naam" required>
<select name="cls"><option>9</option><option>10</option><option>11</option><option>12</option></select>
<input name="phone" placeholder="Parent ka phone" inputmode="numeric">
<input name="fee" placeholder="Mahine ki fees (₹)" inputmode="numeric">
<button>➕ Student jodo</button>
</form></div>
{% for s in rows %}
<div class="card row">
<div><b>{{ s.name }}</b><br><span class="muted">{{ s.parent_phone or "-" }} · ₹{{ s.monthly_fee }}/mahina</span></div>
<div style="text-align:right"><span class="badge">Class {{ s.cls }}</span>
<form method="post" action="/delete/{{ s.id }}" onsubmit="return confirm('Delete karna hai?')"><button class="del">Hatao</button></form></div>
</div>
{% endfor %}
{% endblock %}
